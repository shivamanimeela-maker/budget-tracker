<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Dashboard</h1>

    <!-- User ID (AUTO from login) -->
    <input id="userId" readonly>

    <h2>Add Income</h2>
    <input id="incomeAmount" placeholder="Amount">
    <input id="incomeSource" placeholder="Source">
    <input id="incomeDate" type="date">
    <button onclick="addIncome()">Add Income</button>

    <h2>Add Expense</h2>
    <input id="expenseAmount" placeholder="Amount">
    <input id="expenseCategory" placeholder="Category">
    <input id="expenseDate" type="date">
    <input id="expenseDesc" placeholder="Description">
    <button onclick="addExpense()">Add Expense</button>

    <p id="msg" class="success"></p>

    <button onclick="goSummary()">View Monthly Summary</button>

</div>

<script>
/* ✅ LOAD USER ID FROM LOGIN */
document.getElementById("userId").value =
    localStorage.getItem("userId");

/* ✅ ADD INCOME */
function addIncome() {
    const userId = document.getElementById("userId").value;

    fetch(`http://localhost:8083/income/add/${userId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            amount: incomeAmount.value,
            source: incomeSource.value,
            date: incomeDate.value
        })
    })
    .then(() => {
        msg.innerText = "Income added successfully";
    });
}

/* ✅ ADD EXPENSE */
function addExpense() {
    const userId = document.getElementById("userId").value;

    fetch(`http://localhost:8083/expense/add/${userId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            amount: expenseAmount.value,
            category: expenseCategory.value,
            date: expenseDate.value,
            description: expenseDesc.value
        })
    })
    .then(() => {
        msg.innerText = "Expense added successfully";
    });
}

/* GO TO SUMMARY */
function goSummary() {
    window.location.href = "summary.html";
}
</script>

</body>
</html>
